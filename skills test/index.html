<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills test</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 350px;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
    color: #333;
  }

  .form-control {
    border-radius: 10px;
    padding: 10px;
  }

  .form-control:focus {
    box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
    border-color: #764ba2;
  }

  .btn-primary {
    width: 100%;
    border-radius: 10px;
    padding: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    font-weight: 500;
    transition: 0.3s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
  }

  #result1 {
    text-align: center;
    font-weight: 500;
    margin-top: 15px;
  }
</style>

</head>

<body> 
  <div class="container">
    <h1>Create your Account</h1>

    <div class="mb-3">
      <label for="username_input" class="form-label">Username</label>
      <input type="text" class="form-control" id="username_input">
    </div>

    <div class="mb-3">
      <label for="password_input" class="form-label">Password</label>
      <input type="password" class="form-control" id="password_input">
    </div>

    <button class="btn btn-primary" py-click="sign_up">Sign up</button>
    <p id="result1" class="mt-3"></p>
  </div>

  <script type="py" src="main.py"></script>
</body>
</html>
